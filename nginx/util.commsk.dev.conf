# Nginx reverse proxy config for util.commsk.dev
# Deploy: cp this file to /etc/nginx/sites-available/util.commsk.dev
# Then: ln -sf /etc/nginx/sites-available/util.commsk.dev /etc/nginx/sites-enabled/
# Then: certbot --nginx -d util.commsk.dev
# Then: nginx -t && systemctl reload nginx

upstream utility_app {
    server 127.0.0.1:3014;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name util.commsk.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name util.commsk.dev;

    # SSL (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/util.commsk.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/util.commsk.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header X-XSS-Protection "1; mode=block"                     always;
    add_header Referrer-Policy "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Logging
    access_log /var/log/nginx/util.commsk.dev.access.log;
    error_log  /var/log/nginx/util.commsk.dev.error.log;

    # Limits
    client_max_body_size 10M;

    # Next.js static assets (long cache)
    location /_next/static/ {
        proxy_pass http://utility_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
    }

    # Public static files
    location /public/ {
        proxy_pass http://utility_app;
        add_header Cache-Control "public, max-age=86400";
        proxy_set_header Host $host;
    }

    # Main proxy
    location / {
        proxy_pass http://utility_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        # Disable buffering for SSE / streaming
        proxy_buffering off;
    }
}
